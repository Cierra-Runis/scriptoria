[workspace]
members = ["crates/*"]

[package]
name = "scriptoria"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# The UI: GPUI (a pinned snapshot of Zed's, as gpui-pre) with its platform layer and GPUI Component.
gpui-kit = "0.9"
lyon = "1.0"
serde_json = "1"
scriptoria-ink = { path = "crates/ink" }
scriptoria-outline = { path = "crates/outline" }
scriptoria-skeleton = { path = "crates/skeleton" }
scriptoria-font = { path = "crates/font" }
scriptoria-project = { path = "crates/project" }
scriptoria-reference = { path = "crates/reference" }
scriptoria-template = { path = "crates/template" }
scriptoria-charsets = { path = "crates/charsets" }

# The tools in `examples/` and the pipeline test in `tests/` (they read `test/test.pdf`).
[dev-dependencies]
# Headless windows and simulated input for the UI tests.
gpui-kit = { version = "0.9", features = ["test-support"] }
scriptoria-testkit = { path = "crates/testkit" }
# Reading exported fonts back.
skrifa = "0.49"

# Optimize the compute-heavy packages even in debug builds, so the viewer and tests stay fast
# (only these packages; they compile quickly).
[profile.dev.package.scriptoria-skeleton]
opt-level = 3

[profile.dev.package.scriptoria-outline]
opt-level = 3

[profile.dev.package.lyon_tessellation]
opt-level = 3

[profile.dev.package.kurbo]
opt-level = 3

[profile.dev.package.scriptoria-testkit]
opt-level = 3

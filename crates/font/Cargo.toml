[package]
name = "scriptoria-font"
version = "0.1.0"
edition = "2024"
description = "Writes variable TrueType fonts (glyf + gvar) from compatible cubic master outlines, keeping contour order, start points and overlaps"

[dependencies]
kurbo = "0.13"
write-fonts = { version = "0.55", features = ["read"] }

[dev-dependencies]
skrifa = "0.49"
scriptoria-testkit = { path = "../testkit" }

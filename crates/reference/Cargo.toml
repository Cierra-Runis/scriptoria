[package]
name = "scriptoria-reference"
version = "0.1.0"
edition = "2024"
description = "Reads glyph boxes, advances and outlines from an installed font (OpenType or a collection), to place handwriting as a typeface does"

[dependencies]
kurbo = "0.13"
memmap2 = "0.9"
skrifa = "0.49"

[dev-dependencies]
scriptoria-font = { path = "../font" }
